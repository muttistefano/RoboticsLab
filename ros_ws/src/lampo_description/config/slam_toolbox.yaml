# slam_toolbox, online asynchronous mode.
#
# Use this to BUILD the map that map/map.yaml ships pre-made:
#   T1: ros2 launch lampo_description lampo_sandbox.launch.py
#   T2: ros2 launch lampo_description lampo_gz_mm.launch.py
#   T3: ros2 launch lampo_description lampo_slam.launch.py
#   T4: ros2 launch lampo_description lampo_joy.launch.py    (drive it around)
#   then: ros2 service call /r1_/slam_toolbox/save_map \
#           slam_toolbox/srv/SaveMap "{name: {data: my_map}}"
#
# Frame names carry the PREFIX_ sentinel, which lampo_slam.launch.py replaces
# with the robot's namespace -- the same mechanism used for the controllers.
# The top-level key is /** (match any node) rather than the node's name.
# A bare `slam_toolbox:` key only matches a node whose FULLY QUALIFIED name is
# `/slam_toolbox` -- this node runs as `/<namespace>/slam_toolbox`, so the key never
# matched and every parameter below was silently ignored, leaving the node on
# its defaults. Nothing errors; the node simply does not do what this file says.
/**:
  ros__parameters:
    use_sim_time: true

    # --- frames and topics ---
    odom_frame: PREFIX_odom
    map_frame: map
    base_frame: PREFIX_base_footprint
    scan_topic: lidar
    mode: mapping

    # --- solver ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0

    # The lidar is a 30 m sensor; asking for more just wastes computation.
    # Matches the sensor in urdf/sweepee/sweepee_omni.xacro (0.15 - 30 m).
    # Left at the default 0.0, slam_toolbox warns that the minimum range
    # exceeds the sensor's capabilities and treats close returns as valid.
    min_laser_range: 0.15
    max_laser_range: 29.0
    resolution: 0.05
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # --- scan matching ---
    use_scan_matching: true
    use_scan_barycenter: true
    # This base is 1.02 m long; move/rotate thresholds are set so a slow
    # warehouse traverse still produces enough keyframes to close loops.
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # --- correlation ---
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # --- scan matcher ---
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
